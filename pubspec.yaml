name: traductor
description: "Luma: una experiencia sutil de traducción en pantalla. Prototipo interactivo."
publish_to: 'none'

version: 1.0.0+8011

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true
  assets:
    - assets/licenses/
    - assets/models/opus-en-es/encoder.onnx
    - assets/models/opus-en-es/decoder.onnx
    - assets/models/opus-en-es/tokenizer.json
    - assets/models/opus-en-es/terminology.json
    - assets/models/opus-en-es/manifest.json
    - assets/models/opus-en-es/LICENSE.CC-BY-4.0.txt
    - assets/models/opus-en-es/README.upstream.md
    - assets/models/opus-en-es/english-ocr.onnx
    - assets/models/opus-en-es/english-ocr-fallback.onnx
    - assets/models/opus-en-es/text-detector.onnx
    - assets/models/opus-en-es/ocr-characters.json
    - assets/models/opus-en-es/ocr-characters-fallback.json
    - assets/models/opus-en-es/LICENSE.OCR.Apache-2.0.txt
